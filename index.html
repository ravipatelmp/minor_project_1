<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SparkVibe AI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-wrapper">
        <div class="logo"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
        <h1>AI Image Generator</h1>
      </div>
      <button class="theme-toggle" title="Toggle Dark/Light Mode">
        <i class="fa-solid fa-moon"></i>
      </button>
    </header>

    <div class="main-content">
      <form class="prompt-form">
        <div class="prompt-container">
          <textarea class="prompt-input" placeholder="Describe your imagination in detail..." autofocus required></textarea>
          <button type="button" class="prompt-btn" title="Random Prompt">
            <i class="fa-solid fa-dice"></i>
          </button>
        </div>

        <div class="prompt-actions">
          <div class="select-wrapper">
            <select id="count-select" class="custom-select">
              <option value="" disabled selected>Image Num</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
            </select>
          </div>

          <button type="submit" class="generate-btn">
            <i class="fa-solid fa-wand-sparkles"></i> Generate
          </button>
        </div>
      </form>
      
      <div class="gallery-grid">
        </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
